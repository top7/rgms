version: "3"

# MediaCMS - Déploiement VPS derrière un Nginx hôte (reverse proxy)
# Le service web écoute uniquement en local sur 127.0.0.1:9000
# L'instance est servie publiquement via le Nginx de l'hôte :
#   https://media.romain-giusiano.com -> proxy_pass http://127.0.0.1:9000
#
# Démarrage :
#   FRONTEND_HOST=https://media.romain-giusiano.com docker compose -f docker-compose-vps.yaml up -d
#
# Création du compte admin au premier démarrage (une seule fois, puis commenter) :
#   Ajouter dans l'environnement du service "migrations" :
#     ADMIN_USER: 'admin'
#     ADMIN_EMAIL: 'admin@romain-giusiano.com'
#     ADMIN_PASSWORD: 'changer_ce_mot_de_passe'

services:
  migrations:
    image: mediacms/mediacms:latest
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_CELERY_BEAT: 'no'
      FRONTEND_HOST: ${FRONTEND_HOST:-https://media.romain-giusiano.com}
    command: "./deploy/docker/prestart.sh"
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  web:
    image: mediacms/mediacms:latest
    restart: always
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
      FRONTEND_HOST: ${FRONTEND_HOST:-https://media.romain-giusiano.com}
    depends_on:
      - migrations

  celery_beat:
    image: mediacms/mediacms:latest
    restart: always
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
      FRONTEND_HOST: ${FRONTEND_HOST:-https://media.romain-giusiano.com}
    depends_on:
      - redis

  celery_worker:
    image: mediacms/mediacms:latest
    restart: always
    volumes:
      - media_store:/home/mediacms.io/mediacms/media_files/
      - static_store:/home/mediacms.io/mediacms/static/
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_MIGRATIONS: 'no'
      FRONTEND_HOST: ${FRONTEND_HOST:-https://media.romain-giusiano.com}
    depends_on:
      - migrations

  db:
    image: postgres:17.2-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: mediacms
      POSTGRES_DB: mediacms
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=db --dbname=mediacms --username=mediacms"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: "redis:alpine"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  media_store:
  static_store:
